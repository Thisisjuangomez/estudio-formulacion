<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formula Quest · Formulación de proyectos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020;--bg2:#121a33;--card:#151f3d;--card2:#1b2750;--line:#2a3a6e;
  --tx:#e9eeff;--mut:#9aa7d6;--acc:#7c5cff;--acc2:#22d3ee;--ok:#22c55e;--bad:#f43f5e;--gold:#fbbf24;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Space Grotesk",system-ui,sans-serif}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 10% -10%,#2b1f6b55,transparent 60%),
  radial-gradient(800px 500px at 110% 10%,#0e4b6b55,transparent 60%),
  linear-gradient(#ffffff05 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,#ffffff05 1px,transparent 1px) 0 0/32px 32px,var(--bg)}
button{font-family:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 20px;background:#0b1020cc;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:20px;letter-spacing:.5px;cursor:pointer;white-space:nowrap}
.logo span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hud{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.xpbar{width:140px;height:8px;background:#0006;border-radius:9px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:6px 10px;font-size:14px}
main{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
h1{font-size:34px;margin:6px 0 4px}
h2{margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 20px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:26px}
.mode{border-radius:var(--r);padding:18px;border:1px solid var(--line);background:linear-gradient(135deg,#7c5cff33,#22d3ee22);cursor:pointer;transition:transform .15s,box-shadow .15s}
.mode:hover{transform:translateY(-3px);box-shadow:0 10px 30px #0008}
.mode b{font-size:18px;display:block;margin-bottom:4px}
.mode small{color:var(--mut)}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.world{position:relative;border-radius:var(--r);padding:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;overflow:hidden;transition:transform .15s,border-color .15s}
.world:hover{transform:translateY(-3px);border-color:var(--wc)}
.world:before{content:"";position:absolute;inset:auto -40px -60px auto;width:160px;height:160px;border-radius:50%;background:var(--wc);opacity:.18;filter:blur(10px)}
.world .num{font-size:12px;color:var(--mut);letter-spacing:1px}
.world .ic{font-size:30px;margin:6px 0}
.world b{font-size:18px}
.world p{color:var(--mut);font-size:13px;margin:6px 0 10px;min-height:34px}
.stars{color:var(--gold);letter-spacing:2px}
.stars .off{color:#ffffff22}
.prog{height:6px;background:#0006;border-radius:9px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--wc)}
/* play */
.play{display:grid;grid-template-columns:1fr 280px;gap:18px}
@media(max-width:900px){.play{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--wc,#7c5cff);color:#0b1020;font-weight:700}
.qcount{color:var(--mut);font-size:13px}
.prompt{font-size:19px;line-height:1.5;margin:4px 0 14px}
.prompt b{color:#fff}
.chart{background:#0b1020;border:1px solid var(--line);border-radius:14px;padding:8px;margin:10px 0 16px}
.chart svg{width:100%;height:auto;display:block}
.ans{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.ans input{flex:1;min-width:180px;font-size:22px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:#0b1020;color:var(--tx);font-family:"JetBrains Mono",monospace;outline:none}
.ans input:focus{border-color:var(--acc)}
.unit{display:flex;align-items:center;padding:0 14px;border-radius:14px;background:var(--card2);color:var(--mut);font-weight:700}
.btn{border:0;border-radius:14px;padding:12px 20px;font-size:16px;font-weight:700;color:#0b1020;background:linear-gradient(90deg,var(--acc2),#a5f3fc);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.pri{background:linear-gradient(90deg,var(--acc),#a78bfa);color:#fff}
.note{color:var(--mut);font-size:12px;margin-top:8px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#0b1020;color:var(--tx);font-size:16px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:#22c55e22}
.opt.bad{border-color:var(--bad);background:#f43f5e22}
.order{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.order{grid-template-columns:1fr}}
.pool,.built{display:flex;flex-direction:column;gap:8px;min-height:60px}
.chip{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#0b1020;color:var(--tx);text-align:left;font-size:14px;font-family:"JetBrains Mono",monospace}
.chip:hover{border-color:var(--acc2)}
.chip.ok{border-color:var(--ok)}.chip.bad{border-color:var(--bad);background:#f43f5e1a}
.built .chip{cursor:default}
.lbl{font-size:12px;color:var(--mut);letter-spacing:1px;margin-bottom:4px}
.fb{margin-top:16px;border-radius:16px;padding:16px 18px;display:none;animation:pop .25s}
.fb.ok{display:block;background:#22c55e18;border:1px solid #22c55e66}
.fb.bad{display:block;background:#f43f5e14;border:1px solid #f43f5e66}
.fb h3{margin:0 0 8px}
.steps{margin:8px 0 0;padding-left:20px}
.steps li{margin:6px 0;font-family:"JetBrains Mono",monospace;font-size:14px;line-height:1.5}
.hint{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:#fbbf2415;border:1px dashed #fbbf2480;color:#fde68a;font-size:14px}
.side{display:flex;flex-direction:column;gap:14px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.stat:last-child{border:0}
.hearts{font-size:22px;letter-spacing:3px}
.combo{font-size:30px;font-weight:700;background:linear-gradient(90deg,var(--gold),#fb7185);-webkit-background-clip:text;background-clip:text;color:transparent}
.timer{font-size:40px;font-weight:700;font-family:"JetBrains Mono",monospace}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.float{position:fixed;pointer-events:none;font-weight:700;font-size:22px;color:var(--gold);animation:up 1s forwards;z-index:50}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.result{text-align:center;padding:30px}
.big{font-size:56px;margin:10px 0}
.formulas{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;border-top:4px solid var(--wc)}
.fcard h3{margin:0 0 10px}
.f{font-family:"JetBrains Mono",monospace;background:#0b1020;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13.5px}
.f em{color:var(--mut);font-style:normal;font-family:"Space Grotesk";display:block;font-size:12px;margin-top:2px}
table.t{width:100%;border-collapse:collapse;font-family:"JetBrains Mono",monospace;font-size:13px;margin-top:8px}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--mut);font-weight:600}
.hl{background:#fbbf2422}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.back{background:none;border:0;color:var(--mut);font-size:14px;padding:0;margin-bottom:10px}
.back:hover{color:var(--tx)}
.kbd{font-family:"JetBrains Mono";font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;color:var(--mut)}
</style>
</head>
<body><a href="index.html" style="position:fixed;bottom:14px;left:14px;z-index:9999;font:600 13px system-ui,sans-serif;background:#1c1c1a;color:#fff;padding:7px 12px;border-radius:99px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.25)">← Ruta de estudio</a>
<canvas id="fx"></canvas>
<header>
  <div class="logo" onclick="go('home')">⚡ <span>FORMULA QUEST</span></div>
  <div class="hud">
    <div class="pill">Nivel <b id="lvl">1</b><div class="xpbar"><i id="xpfill" style="width:0"></i></div><span id="xptxt" class="mono" style="font-size:12px;color:var(--mut)">0 XP</span></div>
    <div class="pill">🔥 Racha <b id="bestStreak">0</b></div>
    <div class="pill">🎯 <b id="acc">–</b></div>
    <button class="iconbtn" id="mute" onclick="toggleMute()">🔊</button>
    <button class="iconbtn" onclick="go('learn')">📖 Aprende</button>
    <button class="iconbtn" onclick="go('formulas')">📘 Fórmulas</button>
  </div>
</header>
<main id="app"></main>

<script>
/* ============ utilidades ============ */
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const RS=(a,b,s)=>+(a+s*RI(0,Math.round((b-a)/s))).toFixed(6);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=(x,d=2)=>Number(x).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(x,d=2)=>fmt(x*100,d)+'%';
const M=(x,d=2)=>'$'+fmt(x,d)+' M';
const pesos=x=>'$'+fmt(x,0);
function parseNum(s){
  if(s==null)return NaN; s=String(s).trim().replace(/[\s$%]/g,'').replace(/[−–]/g,'-');
  if(!s)return NaN;
  const dots=(s.match(/\./g)||[]).length, commas=(s.match(/,/g)||[]).length;
  if(dots&&commas){ s=s.lastIndexOf(',')>s.lastIndexOf('.')? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if(dots>1) s=s.replace(/\./g,'');
  else if(commas>1) s=s.replace(/,/g,'');
  else s=s.replace(',','.');
  return parseFloat(s);
}
const CAP={12:{n:'mensual',v:'MV',a:'MA',p:'mes',ps:'meses'},6:{n:'bimestral',v:'BV',a:'BA',p:'bimestre',ps:'bimestres'},4:{n:'trimestral',v:'TV',a:'TA',p:'trimestre',ps:'trimestres'},2:{n:'semestral',v:'SV',a:'SA',p:'semestre',ps:'semestres'}};
function irr(flows){ // flows[0] negativo
  const npv=r=>flows.reduce((s,f,t)=>s+f/Math.pow(1+r,t),0);
  let lo=-0.99,hi=10; if(npv(lo)*npv(hi)>0)return NaN;
  for(let k=0;k<200;k++){const m=(lo+hi)/2; if(npv(lo)*npv(m)<=0)hi=m; else lo=m;}
  return (lo+hi)/2;
}
const npvAt=(flows,r)=>flows.reduce((s,f,t)=>s+f/Math.pow(1+r,t),0);

/* ============ gráficos SVG ============ */
function cfChart(items,o={}){
  const W=640,H=230,pl=36,pr=36; const n=Math.max(1,...items.map(a=>a.t));
  const mx=Math.max(1e-9,...items.map(a=>Math.abs(a.v||0)));
  const mid=H/2, sc=(H/2-36)/mx, x=t=>pl+(W-pl-pr)*t/n;
  let s=`<svg viewBox="0 0 ${W} ${H}"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14z" fill="context-stroke"/></marker></defs>`;
  s+=`<line x1="${pl-10}" y1="${mid}" x2="${W-pr+10}" y2="${mid}" stroke="#5b6aa8" stroke-width="2"/>`;
  for(let t=0;t<=n;t++){s+=`<line x1="${x(t)}" y1="${mid-4}" x2="${x(t)}" y2="${mid+4}" stroke="#5b6aa8"/>`;}
  items.forEach(a=>{
    const v=a.v||0, h=Math.max(18,Math.abs(v)*sc), up=v>=0, y2=up?mid-h:mid+h, c=a.unk?'#fbbf24':(up?'#22c55e':'#f43f5e');
    s+=`<line x1="${x(a.t)}" y1="${mid}" x2="${x(a.t)}" y2="${y2}" stroke="${c}" stroke-width="4" ${a.unk?'stroke-dasharray="6 4"':''} marker-end="url(#ah)"/>`;
    s+=`<text x="${x(a.t)}" y="${up?y2-12:y2+22}" fill="${c}" font-size="13" font-family="JetBrains Mono, monospace" text-anchor="middle">${a.lab!=null?a.lab:fmt(v,1)}</text>`;
  });
  for(let t=0;t<=n;t++){ if(n>14&&t%Math.ceil(n/12)&&t!==n)continue; s+=`<text x="${x(t)}" y="${H-6}" fill="#9aa7d6" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">${t}</text>`;}
  if(o.title)s+=`<text x="10" y="16" fill="#9aa7d6" font-size="12">${o.title}</text>`;
  return s+'</svg>';
}
function lineChart(series,o={}){
  const W=640,H=260,pl=58,pr=18,pt=24,pb=36;
  const all=series.flatMap(s=>s.pts); let xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
  (o.marks||[]).forEach(m=>{xs.push(m.x);ys.push(m.y)});
  let x0=o.xmin??Math.min(...xs),x1=o.xmax??Math.max(...xs),y0=Math.min(0,...ys),y1=Math.max(0,...ys);
  if(o.ymin!=null)y0=o.ymin; const pad=(y1-y0)*0.08||1; y0-=y0<0?pad:0; y1+=pad;
  const X=v=>pl+(W-pl-pr)*(v-x0)/((x1-x0)||1), Y=v=>H-pb-(H-pt-pb)*(v-y0)/((y1-y0)||1);
  let s=`<svg viewBox="0 0 ${W} ${H}" font-family="Space Grotesk, sans-serif">`;
  for(let k=0;k<=4;k++){const v=y0+(y1-y0)*k/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ffffff10"/><text x="${pl-6}" y="${Y(v)+4}" fill="#9aa7d6" font-size="11" text-anchor="end" font-family="JetBrains Mono, monospace">${(o.yfmt||(v=>fmt(v,0)))(v)}</text>`;}
  for(let k=0;k<=5;k++){const v=x0+(x1-x0)*k/5;s+=`<text x="${X(v)}" y="${H-pb+16}" fill="#9aa7d6" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">${(o.xfmt||(v=>fmt(v,0)))(v)}</text>`;}
  if(y0<0&&y1>0)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="#9aa7d6" stroke-dasharray="4 4"/>`;
  series.forEach(se=>{
    if(se.bars){se.pts.forEach(p=>{const bw=(W-pl-pr)/(se.pts.length+1)*0.5;s+=`<rect x="${X(p[0])-bw/2}" y="${Math.min(Y(p[1]),Y(0))}" width="${bw}" height="${Math.abs(Y(p[1])-Y(0))}" fill="${p[1]>=0?'#22c55e66':'#f43f5e66'}" rx="3"/>`});return;}
    const d=se.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="3" stroke-linejoin="round"/>`;
    if(se.dots)se.pts.forEach(p=>s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${se.color}"/>`);
  });
  let lx=pl+6; series.filter(s=>s.label).forEach(se=>{s+=`<rect x="${lx}" y="6" width="12" height="4" fill="${se.color||'#22c55e'}"/><text x="${lx+16}" y="12" fill="#c7d0f5" font-size="11">${se.label}</text>`;lx+=se.label.length*6.5+34;});
  (o.marks||[]).forEach(m=>{s+=`<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="7" fill="none" stroke="${m.color||'#fbbf24'}" stroke-width="3"/><text x="${X(m.x)+(m.left?-10:10)}" y="${Y(m.y)+(m.below?22:-10)}" fill="${m.color||'#fbbf24'}" font-size="12" text-anchor="${m.left?'end':'start'}" font-weight="700">${m.label}</text>`;});
  if(o.xLabel)s+=`<text x="${W-pr}" y="${H-4}" fill="#9aa7d6" font-size="11" text-anchor="end">${o.xLabel}</text>`;
  return s+'</svg>';
}
function growthChart(i,m,label){
  const pts=[];for(let k=0;k<=m;k++)pts.push([k,100*Math.pow(1+i,k)]);
  return lineChart([{pts,color:'#22d3ee',dots:true,label}],{ymin:95,yfmt:v=>fmt(v,1),xLabel:'periodos'});
}
function amortTable(P,i,n,hl){
  const A=P*i/(1-Math.pow(1+i,-n));let s=P,rows='';
  for(let t=1;t<=n;t++){const int=s*i,ab=A-int;s-=ab;rows+=`<tr class="${hl&&hl.includes(t)?'hl':''}"><td>${t}</td><td>${fmt(A)}</td><td>${fmt(int)}</td><td>${fmt(ab)}</td><td>${fmt(Math.max(0,s))}</td></tr>`;}
  return `<table class="t"><tr><th>Año</th><th>Cuota</th><th>Interés</th><th>Abono</th><th>Saldo</th></tr><tr><td>0</td><td></td><td></td><td></td><td>${fmt(P)}</td></tr>${rows}</table>`;
}

/* ============ generadores ============ */
const G={};
/* --- TASAS --- */
G.tasas=[
 function(){const m=pick([12,4,2,6]),j=RS(12,36,1)/100,i=j/m,ea=Math.pow(1+i,m)-1;
  return{tag:'Nominal → EA',prompt:`Un banco ofrece <b>${pct(j,0)} N${CAP[m].v}</b> (nominal ${CAP[m].n} vencida). ¿Cuál es la tasa <b>efectiva anual</b>?`,type:'num',answer:ea*100,unit:'% EA',tol:{abs:.03},
  hint:'Divide la nominal entre m para tener la tasa periódica y luego capitaliza m veces: EA = (1+i)^m − 1.',
  steps:[`i ${CAP[m].n} = j / m = ${pct(j,0)} / ${m} = ${pct(i,4)}`,`EA = (1 + ${pct(i,4)})^${m} − 1`,`EA = ${pct(ea,4)}`],chart:()=>growthChart(i,m,'$100 capitalizándose cada '+CAP[m].p)}},
 function(){const m=pick([12,4,2]),ea=RS(8,32,1)/100,ip=Math.pow(1+ea,1/m)-1;
  return{tag:'EA → periódica',prompt:`Un CDT paga <b>${pct(ea,0)} EA</b>. ¿Cuál es la tasa <b>efectiva ${CAP[m].n}</b> equivalente?`,type:'num',answer:ip*100,unit:'% '+CAP[m].p,tol:{abs:.01},
  hint:'Tasas equivalentes: (1+EA) = (1+i)^m  →  i = (1+EA)^(1/m) − 1.',
  steps:[`(1 + EA) = (1 + i)^${m}`,`i = (1 + ${pct(ea,0)})^(1/${m}) − 1`,`i = ${pct(ip,4)} efectiva ${CAP[m].n}`],chart:()=>growthChart(ip,m,'Crecimiento por '+CAP[m].p)}},
 function(){const m=pick([12,4,2]),ea=RS(8,32,1)/100,ip=Math.pow(1+ea,1/m)-1,j=ip*m;
  return{tag:'EA → nominal',prompt:`Convierte <b>${pct(ea,0)} EA</b> a tasa <b>nominal ${CAP[m].n} vencida (N${CAP[m].v})</b>.`,type:'num',answer:j*100,unit:'% N'+CAP[m].v,tol:{abs:.03},
  hint:'Primero pasa la EA a periódica: i = (1+EA)^(1/m) − 1; después multiplica por m.',
  steps:[`i = (1 + ${pct(ea,0)})^(1/${m}) − 1 = ${pct(ip,4)}`,`j = i × m = ${pct(ip,4)} × ${m}`,`j = ${pct(j,4)} N${CAP[m].v}`]}},
 function(){const m=pick([12,4]),j=RS(12,30,1)/100,ia=j/m,iv=ia/(1-ia),ea=Math.pow(1+iv,m)-1;
  return{tag:'Anticipada → EA',prompt:`Un crédito cobra <b>${pct(j,0)} N${CAP[m].a}</b> (nominal ${CAP[m].n} <b>anticipada</b>). ¿Cuál es la tasa <b>efectiva anual</b>?`,type:'num',answer:ea*100,unit:'% EA',tol:{abs:.03},

G.credito=[function(){

  const int1=P*i,ab1=A-int1,s1=P-ab1,int2=s1*i;
  const k=pick(['cuota','int1','ab1','s1','int2']);
  const Q={cuota:['la <b>cuota anual</b>',A,[`A = P × i / (1 − (1+i)^−n)`,`A = ${fmt(P,0)} × ${pct(i,0)} / (1 − (1+${pct(i,0)})^−${n})`,`A = ${M(A)}`],[]],
    int1:['el <b>interés del año 1</b>',int1,[`Interés 1 = saldo inicial × i`,`= ${fmt(P,0)} × ${pct(i,0)} = ${M(int1)}`],[1]],
    ab1:['el <b>abono a capital del año 1</b>',ab1,[`Cuota A = ${M(A)}`,`Interés 1 = ${fmt(P,0)} × ${pct(i,0)} = ${fmt(int1)}`,`Abono = A − interés = ${M(ab1)}`],[1]],
    s1:['el <b>saldo de la deuda al final del año 1</b>',s1,[`A = ${fmt(A)}; interés 1 = ${fmt(int1)}`,`Abono 1 = ${fmt(ab1)}`,`Saldo = ${fmt(P,0)} − ${fmt(ab1)} = ${M(s1)}`],[1]],
    int2:['el <b>interés del año 2</b>',int2,[`A = ${fmt(A)}; abono 1 = ${fmt(ab1)}`,`Saldo 1 = ${fmt(s1)}`,`Interés 2 = ${fmt(s1)} × ${pct(i,0)} = ${M(int2)}`],[2]]}[k];
  return{tag:'Tabla de amortización',prompt:`Préstamo de <b>${M(P,0)}</b> a <b>${n} años</b>, cuota fija, tasa <b>${pct(i,0)} EA</b>. Calcula ${Q[0]}.`,type:'num',answer:Q[1],unit:'M',tol:{abs:.02,rel:.001},
  hint:'Cuota fija: A = P·i/(1−(1+i)^−n). Cada año: interés = saldo × i; abono = cuota − interés; nuevo saldo = saldo − abono. Recuerda: el interés va antes de impuestos y el abono después.',
  steps:Q[2],after:()=>amortTable(P,i,n,Q[3])};
}];

G.eval=[function(){
  const I=RS(50,500,10),n=RI(3,5),r=RS(10,20,1)/100,mult=R(.2,.5);const f=[-I];
  for(let t=1;t<=n;t++)f.push(+(I*mult*R(.75,1.3)).toFixed(1));
  const vpn=npvAt(f,r),tir=irr(f),vpB=vpn+I,rbc=vpB/I;
  const k=pick(['vpn','vpn','tir','rbc','dec']);
  const chart=()=>cfChart(f.map((v,t)=>({t,v,lab:fmt(v,1)})),{title:'Flujo de caja (millones, años)'});
  const after=()=>isNaN(tir)?'':lineChart([{pts:Array.from({length:61},(_,j)=>{const x=j/60*Math.max(.5,tir*1.8,r*2.5);return[x*100,npvAt(f,x)]}),color:'#a78bfa',label:'VPN según la tasa'}],{xfmt:v=>fmt(v,0)+'%',yfmt:v=>fmt(v,0),xLabel:'tasa de descuento',marks:[{x:r*100,y:vpn,label:'VPN @ '+pct(r,0)},{x:tir*100,y:0,label:'TIR '+pct(tir,1),color:'#22d3ee',below:1}]});
  const base=`Inversión <b>${M(I,0)}</b>, flujos anuales ${f.slice(1).map(v=>'<b>'+fmt(v,1)+'</b>').join(', ')} millones. Tasa de descuento (WACC) <b>${pct(r,0)}</b>.`;
  const stepsV=f.map((v,t)=>`t=${t}: ${fmt(v,1)} / (1+${pct(r,0)})^${t} = ${fmt(v/Math.pow(1+r,t),3)}`).concat([`VPN = ${M(vpn,3)}`]);
  if(k==='vpn')return{tag:'VPN',ex:'vpn',prompt:base+' ¿Cuál es el <b>VPN</b>?',type:'num',answer:vpn,unit:'M',tol:{abs:.05,rel:.002},hint:'VPN = Σ Ft / (1+i)^t, con F0 = −inversión.',steps:stepsV,chart,after};
  if(k==='tir')return{tag:'TIR',ex:'tir',prompt:base+' ¿Cuál es la <b>TIR</b>? (prueba tasas hasta que el VPN = 0)',type:'num',answer:tir*100,unit:'%',tol:{abs:.15},hint:'TIR es la tasa que hace VPN = 0. Ensaya: si el VPN da positivo, sube la tasa; si da negativo, bájala. En Excel: =TIR(rango).',steps:[`Buscamos i tal que Σ Ft/(1+i)^t = 0`,`VPN @ ${pct(r,0)} = ${fmt(vpn,2)} → ${vpn>0?'sube la tasa':'baja la tasa'}`,`TIR ≈ ${pct(tir,2)}`,`Decisión: ${tir>=r?'TIR ≥ WACC → se acepta':'TIR < WACC → se rechaza'}`],chart,after};
  if(k==='rbc')return{tag:'Relación B/C',ex:'rbc',prompt:base+' ¿Cuál es la <b>relación beneficio/costo</b>?',type:'num',answer:rbc,unit:'veces',tol:{abs:.01},hint:'RBC = VP de los beneficios / VP de la inversión. Acepta si RBC > 1.',steps:[`VP beneficios = ${fmt(vpB,3)}`,`RBC = ${fmt(vpB,3)} / ${fmt(I,0)} = ${fmt(rbc,3)}`,`${rbc>1?'Por cada $1 invertido recupera $'+fmt(rbc,2)+' → se acepta':'Recupera menos de $1 por peso → se rechaza'}`],chart,after};
  const opts=['Aceptar: VPN > 0, TIR > WACC y RBC > 1','Rechazar: VPN < 0, TIR < WACC y RBC < 1','Indiferente: VPN = 0','No se puede decidir sin el flujo del inversionista'];
  return{tag:'Decisión',prompt:base+' Calcula y decide: ¿se hace el proyecto?',type:'mc',options:opts,correct:vpn>0?0:1,hint:'Calcula el VPN a la tasa dada. Los tres criterios siempre coinciden en un proyecto simple.',steps:[`VPN = ${fmt(vpn,2)} M`,`TIR = ${pct(tir,2)} vs WACC ${pct(r,0)}`,`RBC = ${fmt(rbc,3)}`],chart,after};
}];

G.kt=[
 function(){const Ca=RS(120,900,10),nd=RS(30,120,15),ict=Ca/365*nd;

  hint:'ICT = (Ca / 365) × nd',steps:[`Costo diario = ${fmt(Ca,0)} / 365 = ${fmt(Ca/365,4)}`,`ICT = ${fmt(Ca/365,4)} × ${nd} = ${M(ict)}`]}},
 function(){const m=RI(6,8),E=RS(20,80,5),Im=Math.round(E*R(1.3,1.8)),ramp=RI(2,4);const ing=[],acc=[];let s=0;
  for(let k=1;k<=m;k++){const v=Math.round(Im*Math.min(1,(k-1)/ramp));ing.push(v);s+=v-E;acc.push(s);}
  const mn=Math.min(...acc),mi=acc.indexOf(mn);

  return{tag:'Déficit acumulado máximo',prompt:`Proyección mensual (millones). Con el <b>método del déficit acumulado máximo</b>, ¿cuánto capital de trabajo necesita el proyecto?${tbl}`,type:'num',answer:-mn,unit:'M',tol:{abs:.01},
  hint:'Calcula el saldo de cada mes (ingresos − egresos) y ve acumulándolo. El valor más negativo del acumulado (en positivo) es el KT.',
  steps:ing.map((v,k)=>`Mes ${k+1}: ${v} − ${E} = ${v-E}  → acumulado ${acc[k]}`).concat([`Máximo déficit = ${-mn} (mes ${mi+1}) → KT = ${M(-mn,0)}`]),
  after:()=>lineChart([{pts:ing.map((v,k)=>[k+1,v-E]),bars:1},{pts:acc.map((v,k)=>[k+1,v]),color:'#fbbf24',dots:1,label:'Saldo acumulado'}],{xmin:.5,xmax:m+.5,xfmt:v=>fmt(v,0),marks:[{x:mi+1,y:mn,label:'Déficit máx. '+mn,color:'#f43f5e'}],xLabel:'mes'})}},
 function(){const ef=RS(5,40,1),cxc=RS(20,120,5),inv=RS(15,100,5),prov=RS(10,60,5),ocp=RS(5,40,5),imp=RS(2,15,1);const kt=ef+cxc+inv-prov-ocp-imp;

  hint:'KT = activo corriente − pasivo corriente.',steps:[`AC = ${ef} + ${cxc} + ${inv} = ${ef+cxc+inv}`,`PC = ${prov} + ${ocp} + ${imp} = ${prov+ocp+imp}`,`KT = ${ef+cxc+inv} − ${prov+ocp+imp} = ${M(kt,0)}`]}}

G.costos=[function(){

  const k=pick(['mc','pe','pe','pes','util','meta']);const Q=Math.round(pe*R(1.2,2)/10)*10,U=RS(2,30,1);
  const chart=()=>{const qm=Math.max(pe*2,Q*1.1);const pts=n=>Array.from({length:11},(_,j)=>j*qm/10);
    return lineChart([{pts:pts().map(q=>[q,q*P/1e6]),color:'#22c55e',label:'Ingresos'},{pts:pts().map(q=>[q,CF+q*CV/1e6]),color:'#f43f5e',label:'Costos totales'},{pts:pts().map(q=>[q,CF]),color:'#9aa7d6',label:'Costo fijo'}],{yfmt:v=>fmt(v,0)+'M',xfmt:v=>fmt(v,0),xLabel:'unidades',marks:[{x:pe,y:pe*P/1e6,label:'PE',color:'#fbbf24'}]})};

  if(k==='mc')return{tag:'Margen de contribución',prompt:base+' ¿Cuál es el <b>margen de contribución unitario</b>?',type:'num',answer:mc,unit:'$',tol:{abs:1},hint:'Mcu = Pvu − CVu',steps:[`Mcu = ${pesos(P)} − ${pesos(CV)} = ${pesos(mc)}`,`Cada unidad aporta ${pesos(mc)} para cubrir costos fijos y utilidad`],chart};
  if(k==='pe')return{tag:'Punto de equilibrio',prompt:base+' ¿Cuántas unidades debe vender al mes para <b>no ganar ni perder</b>?',type:'num',answer:pe,unit:'unid.',tol:{abs:1.5},hint:'Q = CF / (Pvu − CVu). Ojo: CF está en millones.',steps:[`Mcu = ${pesos(mc)}`,`Q = ${pesos(CF*1e6)} / ${pesos(mc)}`,`Q = ${fmt(pe,2)} unidades`],chart};
  if(k==='pes')return{tag:'PE en pesos',prompt:base+' ¿Cuántas <b>ventas en pesos</b> necesita para el punto de equilibrio?',type:'num',answer:pe*P/1e6,unit:'M',tol:{abs:.02,rel:.002},hint:'PE$ = PE unidades × precio, o CF / (1 − CV/P).',steps:[`PEu = ${fmt(CF*1e6,0)} / ${fmt(mc,0)} = ${fmt(pe,2)}`,`PE$ = ${fmt(pe,2)} × ${pesos(P)} = ${M(pe*P/1e6)}`],chart};
  if(k==='util'){const u=(Q*mc-CF*1e6)/1e6;return{tag:'Utilidad operativa',prompt:base+` Si vende <b>${fmt(Q,0)} unidades</b>, ¿cuál es la utilidad operativa?`,type:'num',answer:u,unit:'M',tol:{abs:.02,rel:.002},hint:'Utilidad = Q × Mcu − CF',steps:[`Q × Mcu = ${fmt(Q,0)} × ${fmt(mc,0)} = ${pesos(Q*mc)}`,`Utilidad = ${pesos(Q*mc)} − ${pesos(CF*1e6)} = ${M(u)}`],chart};}

}];

G.salva=[
 function(){const C=RS(50,400,10),Rv=RS(0,C*.2,5),v=RI(5,10),d=(C-Rv)/v;

const frc=(i,n)=>i/(1-Math.pow(1+i,-n));
function indData(){const I=RS(80,400,10),n=RI(3,5),i=RS(10,20,1)/100,Y=[],E=[];
  for(let t=1;t<=n;t++){const y=Math.round(I*R(.55,.9));Y.push(y);E.push(Math.round(y*R(.35,.6)));}
  const vpY=Y.reduce((s,v,k)=>s+v/Math.pow(1+i,k+1),0),vpE=E.reduce((s,v,k)=>s+v/Math.pow(1+i,k+1),0);
  const net=[-I,...Y.map((y,k)=>y-E[k])];const vpgu=vpY-vpE,vpn=vpgu-I,rbc=vpY/(vpE+I),tir=irr(net),vae=vpn*frc(i,n);
  const tbl=`<table class="t"><tr><th>Año</th>${net.map((_,t)=>`<th>${t}</th>`).join('')}</tr><tr><td>Inversión</td><td>${I}</td>${Y.map(()=>'<td></td>').join('')}</tr><tr><td>Ingresos</td><td></td>${Y.map(v=>`<td>${v}</td>`).join('')}</tr><tr><td>Egresos</td><td></td>${E.map(v=>`<td>${v}</td>`).join('')}</tr><tr><td>Flujo neto</td>${net.map(v=>`<td>${v}</td>`).join('')}</tr></table>`;
  return{I,n,i,Y,E,vpY,vpE,net,vpgu,vpn,rbc,tir,vae,tbl};}
function vpSteps(arr,i,name){return arr.map((v,k)=>`${name} año ${k+1}: ${v} / (1+${pct(i,0)})^${k+1} = ${fmt(v/Math.pow(1+i,k+1),3)}`)}

let AC=null;
function beep(type){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const seq=type==='ok'?[523,659,784]:type==='bad'?[220,165]:type==='lvl'?[523,659,784,1046]:[440];
  seq.forEach((f,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,AC.currentTime+k*.08);g.gain.exponentialRampToValueAtTime(.15,AC.currentTime+k*.08+.01);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+k*.08+.18);o.connect(g).connect(AC.destination);o.start(AC.currentTime+k*.08);o.stop(AC.currentTime+k*.08+.2);});}catch(e){}}
function toggleMute(){S.mute=!S.mute;save();hud();}
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[];
function resize(){cv.width=innerWidth;cv.height=innerHeight}resize();addEventListener('resize',resize);
function confetti(n=80){const cols=['#7c5cff','#22d3ee','#22c55e','#fbbf24','#f472b6'];for(let k=0;k<n;k++)parts.push({x:innerWidth/2,y:innerHeight/2.5,vx:R(-8,8),vy:R(-12,-3),c:pick(cols),s:R(4,8),l:R(60,110),r:R(0,6)});if(parts.length===n)tick();}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});parts=parts.filter(p=>p.l>0&&p.y<innerHeight+20);if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height);}
function floatTxt(t,el){const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='float';d.textContent=t;d.style.left=(r.left+r.width/2-30)+'px';d.style.top=(r.top-10)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000);}

function startWorld(id){
  const w=id==='mix'?{id:'mix',name:'Examen simulado',c:'#f43f5e',ic:'🎲'}:WORLDS.find(x=>x.id===id);
  run={w,total:id==='mix'?12:8,i:0,hearts:id==='mix'?99:3,combo:0,ok:0,xp:0,timed:false,bag:[]};next();
}
function startTimed(){run={w:{id:'mix',name:'Contrarreloj',c:'#22d3ee',ic:'⏱️'},total:999,i:0,hearts:99,combo:0,ok:0,xp:0,timed:true,time:120,bag:[]};next();
  timerId=setInterval(()=>{run.time--;const t=$('#timer');if(t){t.textContent=run.time;t.style.color=run.time<=15?'var(--bad)':''}if(run.time<=0){clearInterval(timerId);end();}},1000);}
function genFor(wid){
  if(wid==='mix'){wid=pick(WORLDS).id;}
  const gens=G[wid];
  if(!run.bag.length||run.bagW!==wid){run.bag=shuffle(gens.map((_,k)=>k));run.bagW=wid;}
  const q=gens[run.bag.pop()]();q.world=wid;return q;
}
function next(){
  if(!run)return; if(!run.timed&&(run.i>=run.total||run.hearts<=0))return end();
  run.i++;cur=genFor(run.w.id);cur.done=false;cur.usedHint=false;cur.t0=Date.now();
  const wc=(WORLDS.find(x=>x.id===cur.world)||run.w).c;
  let body='';
  if(cur.type==='num')body=`<div class="ans"><input id="inp" inputmode="decimal" autocomplete="off" placeholder="Tu respuesta"><div class="unit">${cur.unit}</div><button class="btn" id="chk" onclick="check()">Comprobar</button></div><div class="note">Usa coma o punto para decimales, sin separador de miles. Porcentajes sin el símbolo (ej: 26,82). Presiona <span class="kbd">Enter</span>.</div>`;
  else if(cur.type==='mc')body=`<div class="opts">${cur.options.map((o,k)=>`<button class="opt" onclick="check(${k})"><b style="color:var(--mut)">${'ABCDEF'[k]}.</b> ${o}</button>`).join('')}</div>`;
  else{cur.pool=shuffle(cur.items.map((t,k)=>k));cur.built=[];body=`<div class="order"><div><div class="lbl">RENGLONES DISPONIBLES</div><div class="pool" id="pool"></div></div><div><div class="lbl">TU FLUJO DE CAJA</div><div class="built" id="built"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sec" onclick="undoOrder()">↶ Deshacer</button><button class="btn" id="chk" onclick="check()">Comprobar</button></div></div></div>`;}
  const side=run.timed?`<div class="card" style="text-align:center"><div class="lbl">TIEMPO</div><div class="timer" id="timer">${run.time}</div></div>`:
    `<div class="card"><div class="stat"><span>Vidas</span><span class="hearts">${run.hearts>10?'∞':'❤️'.repeat(run.hearts)+'<span style="opacity:.2">'+'❤️'.repeat(Math.max(0,3-run.hearts))+'</span>'}</span></div><div class="stat"><span>Progreso</span><b>${run.i} / ${run.total}</b></div><div class="prog" style="--wc:${wc}"><i style="width:${(run.i-1)/run.total*100}%"></i></div></div>`;
  $('#app').innerHTML=`<button class="back" onclick="go('home')">← Volver al mapa</button>
  <div class="play"><div class="card" id="qcard" style="--wc:${wc}">
    <div class="qtop"><span class="tag">${cur.tag}</span><span class="qcount">${run.w.ic} ${run.w.name}${run.timed?' · reto '+run.i:''}</span><span style="margin-left:auto"><button class="btn sec" style="padding:6px 12px;font-size:13px" onclick="showHint()">💡 Pista</button> <button class="btn sec" style="padding:6px 12px;font-size:13px" onclick="skip()">Saltar ⏭</button></span></div>

    ${cur.chart?`<div class="chart">${cur.chart()}</div>`:''}
    ${body}
    ${cur.ex&&EXPL[cur.ex]?`<details class="expl" style="margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:#0b1020"><summary style="cursor:pointer;font-weight:700">📖 Explicación: ${EXPL[cur.ex].n}</summary>${explHTML(cur.ex,true)}</details>`:''}
    <div class="hint" id="hint">💡 ${cur.hint}</div>
    <div class="fb" id="fb"></div>
  </div>
  <div class="side">${side}
    <div class="card"><div class="stat"><span>Combo</span><span class="combo">x${1+Math.min(run.combo,5)*0.5}</span></div><div class="stat"><span>Aciertos</span><b>${run.ok}</b></div><div class="stat"><span>XP de la ronda</span><b style="color:var(--gold)">+${run.xp}</b></div></div>
    <div class="card" style="font-size:13px;color:var(--mut)">🎮 Rachas de aciertos suben el combo hasta x3.5. Usar la pista no quita vidas, pero da la mitad de XP.</div>

  if(cur.type==='order')renderOrder();

}
function renderOrder(){
  $('#pool').innerHTML=cur.pool.map(k=>`<button class="chip" onclick="addOrder(${k})">${cur.items[k]}</button>`).join('')||'<div class="note">¡Listo! Comprueba tu flujo.</div>';
  $('#built').innerHTML=cur.built.map((k,j)=>`<div class="chip" id="b${j}">${j+1}. ${cur.items[k]}</div>`).join('')||'<div class="note">Toca los renglones de la izquierda en orden.</div>';
}
function addOrder(k){if(cur.done)return;cur.pool=cur.pool.filter(x=>x!==k);cur.built.push(k);beep('tap');renderOrder();}
function undoOrder(){if(cur.done||!cur.built.length)return;cur.pool.push(cur.built.pop());renderOrder();}
function showHint(){$('#hint').style.display='block';cur.usedHint=true;}
function skip(){if(cur.done)return next();cur.skipped=true;check(-1);}
function check(choice){
  if(!cur||cur.done)return;let ok=false,user='';
  if(cur.type==='num'){if(choice===-1){ok=false}else{const v=parseNum($('#inp').value);if(isNaN(v)){$('#inp').classList.add('shake');setTimeout(()=>$('#inp').classList.remove('shake'),400);return;}
    const tol=Math.max(cur.tol.abs||0,(cur.tol.rel||0)*Math.abs(cur.answer));ok=Math.abs(v-cur.answer)<=tol;user=fmt(v,4);}}
  else if(cur.type==='mc'){ok=choice===cur.correct;document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===cur.correct)b.classList.add('ok');else if(k===choice)b.classList.add('bad');});}
  else{if(choice!==-1&&cur.pool.length){floatTxt('Faltan renglones',$('#chk'));return;}ok=choice!==-1&&cur.built.every((k,j)=>k===j);
    cur.built.forEach((k,j)=>{const el=$('#b'+j);if(el)el.classList.add(k===j?'ok':'bad')});}
  cur.done=true;S.ans++;
  const card=$('#qcard');
  if(ok){S.ok++;run.ok++;run.combo++;const mult=1+Math.min(run.combo-1,5)*0.5;const fast=(Date.now()-cur.t0)<25000?5:0;let g=Math.round((10+fast)*mult*(cur.usedHint?.5:1));run.xp+=g;const lvBefore=Math.floor(S.xp/150);S.xp+=g;
    if(run.combo>S.bestStreak)S.bestStreak=run.combo;beep(Math.floor(S.xp/150)>lvBefore?'lvl':'ok');confetti(run.combo>=3?140:70);floatTxt('+'+g+' XP',$('#chk')||card);
    if(run.timed)run.time+=3;}
  else{run.combo=0;if(!run.timed)run.hearts--;else run.time=Math.max(0,run.time-5);beep('bad');card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),400);}
  save();hud();
  const ansTxt=cur.type==='num'?`<b>${fmt(cur.answer,cur.unit==='unid.'?2:4)} ${cur.unit}</b>`:cur.type==='mc'?`<b>${cur.options[cur.correct]}</b>`:'';
  const fb=$('#fb');fb.className='fb '+(ok?'ok':'bad');
  fb.innerHTML=`<h3>${ok?pick(['¡Correcto! 🎉','¡Bien jugado! ⚡','¡Exacto! 🔥','¡Crack! 🏆']):(cur.skipped?'Saltado':'Casi…')+' La respuesta es '+ansTxt}</h3>${ok&&cur.type==='num'?`Respuesta exacta: ${ansTxt}`:''}
   <div class="lbl" style="margin-top:10px">SOLUCIÓN PASO A PASO</div><ol class="steps">${cur.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
   ${cur.after?`<div class="chart">${cur.after()}</div>`:''}
   <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn pri" id="nx" onclick="next()">${(!run.timed&&(run.i>=run.total||run.hearts<=0))?'Ver resultados 🏁':'Siguiente →'}</button></div>`;
  const chk=$('#chk');if(chk)chk.disabled=true;
  setTimeout(()=>{const nx=$('#nx');if(nx){nx.focus();fb.scrollIntoView({behavior:'smooth',block:'nearest'});}},50);
  if(!run.timed){const sh=document.querySelector('.hearts');if(sh&&run.hearts<=10)sh.innerHTML='❤️'.repeat(Math.max(0,run.hearts))+'<span style="opacity:.2">'+'❤️'.repeat(Math.max(0,3-run.hearts))+'</span>';}
  const cb=document.querySelector('.combo');if(cb)cb.textContent='x'+(1+Math.min(run.combo,5)*0.5);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&cur&&cur.done&&run&&document.activeElement.id!=='inp'){const nx=$('#nx');if(nx){e.preventDefault();next();}}});
function end(){
  clearInterval(timerId);const r=run;if(!r)return;
  const n=r.timed?r.i:r.i, acc=n?r.ok/n:0;
  let st=0;if(!r.timed){const full=r.ok/r.total;st=r.hearts<=0?0:full>=.9?3:full>=.7?2:full>=.5?1:0;
    if(r.w.id!=='mix'&&st>(S.best[r.w.id]||0)){S.best[r.w.id]=st;}}
  if(st===3||(r.timed&&r.ok>=8)){confetti(200);beep('lvl');}
  if(r.timed&&r.ok>(S.bestTimed||0))S.bestTimed=r.ok;
  save();hud();
  const msg=r.timed?`Resolviste <b>${r.ok}</b> retos en 2 minutos. Récord: <b>${S.bestTimed||0}</b>`:(r.hearts<=0?'Te quedaste sin vidas 💔 ¡Revisa las soluciones y vuelve a intentarlo!':`Acertaste <b>${r.ok} de ${r.total}</b>`);
  $('#app').innerHTML=`<div class="card result" style="max-width:620px;margin:30px auto"><div class="big">${r.w.ic}</div><h2>${r.w.name}</h2>${r.timed||r.w.id==='mix'?'':'<div style="font-size:40px">'+stars(st)+'</div>'}
  <p class="sub" style="margin:12px 0">${msg}</p><p>XP ganados: <b style="color:var(--gold)">+${r.xp}</b> · Precisión ${Math.round(acc*100)}%</p>
  <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap"><button class="btn pri" onclick="${r.timed?'startTimed()':`startWorld('${r.w.id}')`}">🔄 Jugar de nuevo</button><button class="btn sec" onclick="go('home')">🗺️ Mapa</button></div></div>`;
  run=null;
}
function explHTML(k,compact){const e=EXPL[k];
  return `<p style="line-height:1.55;margin:10px 0">${e.que}</p>${e.f.map(f=>`<div class="f">${f}</div>`).join('')}<p style="margin:10px 0 6px"><b>Criterio:</b> ${e.crit}</p><p style="margin:6px 0;color:#c7d0f5"><b>Ejemplo:</b> ${e.ej}</p><p class="note" style="font-size:13px">💡 ${e.tip}</p>`;}
function learn(){
  $('#app').innerHTML=`<button class="back" onclick="go('home')">← Volver al mapa</button><h1>📖 Aprende los indicadores</h1><p class="sub">Qué es cada uno, su fórmula, cómo se interpreta y un ejemplo resuelto. Después practica con números aleatorios.</p>
  <div class="formulas">${Object.keys(EXPL).map(k=>`<div class="fcard" style="--wc:${EXPL[k].c}"><h3>${EXPL[k].n}</h3>${explHTML(k)}</div>`).join('')}</div>
  <div class="card" style="margin-top:18px"><h3 style="margin-top:0">¿Cuál uso y cuándo?</h3><table class="t"><tr><th>Indicador</th><th>Responde</th><th>Unidad</th><th>Acepta si</th></tr>
  <tr><td>VPN</td><td style="text-align:left">¿Cuánto valor crea hoy?</td><td>$</td><td>&gt; 0</td></tr>
  <tr><td>VPGU</td><td style="text-align:left">¿Cuánto valen hoy las ganancias?</td><td>$</td><td>&gt; inversión</td></tr>
  <tr><td>TIR</td><td style="text-align:left">¿Qué rentabilidad da?</td><td>%</td><td>≥ tasa de oportunidad</td></tr>
  <tr><td>RBC</td><td style="text-align:left">¿Cuántos pesos devuelve por peso?</td><td>veces</td><td>&gt; 1</td></tr>
  <tr><td>CAUE / VAE</td><td style="text-align:left">¿Cuánto cuesta (o rinde) por año?</td><td>$/año</td><td>menor CAUE · mayor VAE</td></tr></table>
  <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" onclick="startWorld('ind')">🎮 Practicar indicadores</button><button class="btn sec" onclick="startWorld('eval')">🏆 Jefe final: evaluación</button></div></div>`;
}

   ['🔁 Conversión de tasas','#22d3ee',[['i periódica = j / m','Nominal → periódica (m = periodos por año)'],['EA = (1 + i)^m − 1','Periódica → efectiva anual'],['i = (1 + EA)^(1/m) − 1','EA → periódica'],['j = i × m','Periódica → nominal'],['iv = ia / (1 − ia)','Anticipada → vencida'],['ia = iv / (1 + iv)','Vencida → anticipada'],['(1 + i₁)^m₁ = (1 + i₂)^m₂','Equivalencia general']]],

   ['🏦 Crédito','#60a5fa',[['Interés t = saldo t−1 × i',''],['Abono t = cuota − interés t',''],['Saldo t = saldo t−1 − abono t',''],['Escudo fiscal = intereses × t','Ahorro de impuestos por la deuda'],['Kd después de impuestos = i × (1 − t)','']]],
   ['⚖️ Costos','#f472b6',[['Mcu = Pvu − CVu','Margen de contribución unitario'],['Qe = CF / (Pvu − CVu)','Punto de equilibrio en unidades'],['PE$ = Qe × Pvu = CF / (1 − CVu/Pvu)','Punto de equilibrio en pesos'],['Q meta = (CF + U) / Mcu','Unidades para una utilidad'],['Costo primo = MPD + MOD',''],['Costo de conversión = MOD + CIF','']]],
   ['💧 Capital de trabajo','#38bdf8',[['KT = AC − PC','Método contable'],['ICT = (Ca / 365) × nd','Periodo de desfase'],['KT = |mínimo saldo acumulado|','Déficit acumulado máximo']]],
   ['🏭 Depreciación y salvamento','#fb923c',[['D = (costo − residual) / vida útil','Línea recta'],['VL = costo − D × años','Valor en libros'],['VS = VM − t × (VM − VL)','Comercial'],['VS = flujo / i','Económico (perpetuidad)']]],
   ['🧾 Flujo de caja','#facc15',[['UAI = ingresos − egresos − (intereses) − depreciación',''],['Flujo = UAI × (1 − t) + depreciación − inversiones + salvamento','Proyecto'],['… + préstamo − abono a capital','Inversionista']]],
   ['🏆 Evaluación','#f43f5e',[['VPN = Σ Ft / (1 + i)^t','Aceptar si VPN > 0'],['TIR: Σ Ft / (1 + TIR)^t = 0','Aceptar si TIR ≥ WACC'],['RBC = Σ VP ingresos / (I0 + Σ VP egresos)','Aceptar si RBC > 1'],['VPGU = Σ (Yt − Et)/(1+i)^t','VP de las ganancias; VPN = VPGU − I0'],['CAUE = (I0 − VS/(1+i)^n) × i/(1−(1+i)^−n) + CO','Elegir el menor CAUE'],['VAE = VPN × i/(1−(1+i)^−n)','VPN anualizado: elegir el mayor'],['WACC = Wd × Kd × (1 − t) + We × Ke','Costo promedio ponderado del capital']]]
  ];
  $('#app').innerHTML=`<button class="back" onclick="go('home')">← Volver al mapa</button><h1>📘 Hoja de fórmulas</h1><p class="sub">Todo lo que necesitas para el examen final.</p><div class="formulas">${F.map(c=>`<div class="fcard" style="--wc:${c[1]}"><h3>${c[0]}</h3>${c[2].map(f=>`<div class="f">${f[0]}${f[1]?`<em>${f[1]}</em>`:''}</div>`).join('')}</div>`).join('')}</div>`;
}
